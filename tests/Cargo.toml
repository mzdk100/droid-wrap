[package]
name = "droid-wrap-test"
description.workspace = true
authors.workspace = true
keywords.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
publish = false
readme.workspace = true
repository.workspace = true

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 37
max_sdk_version = 37

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera"
required = false

[[package.metadata.android.queries.intent]]
actions = ["android.intent.action.TTS_SERVICE"]

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"

[package.metadata.android.application]
# needed
has_code = false

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "droid_wrap_test"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[lib]
crate-type = ["dylib"]

[dependencies]
jni.workspace = true
ndk-glue.workspace = true

[dependencies.droid-wrap]
path = ".."
features = ["android", "android_app", "android_content", "java", "java_lang"]

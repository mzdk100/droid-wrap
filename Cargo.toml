[dependencies]
jni.workspace = true
log.workspace = true
ndk-context.workspace = true
parking_lot.workspace = true

[dependencies.droid-wrap-macros]
version = "1.0.0"
path = "macros"

[build-dependencies]
android-build.workspace = true
cargo-emit.workspace = true
droid-wrap-codegen = { version = "1.0.0", path = "codegen" }
noak.workspace = true

[workspace]
members = ["codegen", "example", "macros", "tests"]
resolver = "3"
